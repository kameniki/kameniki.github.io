
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roblox Username Generator</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:25px 15px;
 background:#101114;color:#eee;
 font-family:Arial,sans-serif
}
main{
 max-width:520px;margin:20px auto;
 background:#191b20;border:1px solid #30333a;
 border-radius:16px;padding:22px
}
h2{margin:0 0 8px}
.sub{color:#888;font-size:13px}
.section{margin-top:25px}
.length{
 display:flex;justify-content:space-between;
 margin-bottom:12px
}
input[type=range]{width:100%;accent-color:#35c879}
.options{display:flex;gap:10px;margin-top:12px}
.option{
 flex:1;padding:14px;
 border:1px solid #393d45;
 border-radius:9px;text-align:center;
 background:#202329
}
.option input{accent-color:#35c879}
input[type=number]{
 width:80px;padding:8px;
 background:#111317;color:white;
 border:1px solid #444;border-radius:7px
}
button{
 padding:12px;border:0;border-radius:8px;
 background:#30343b;color:white;
 cursor:pointer;font-size:14px
}
button:disabled{opacity:.4;cursor:not-allowed}
.primary{
 width:100%;margin-top:22px;
 background:#238d53;font-weight:bold
}
.result{
 margin-top:22px;padding:17px;
 background:#111317;border:1px solid #343840;
 border-radius:10px
}
.username{
 font-family:monospace;font-size:25px;
 overflow-wrap:anywhere;text-align:center;
 padding:17px 0
}
.status{text-align:center;font-size:13px;color:#aaa}
.good{color:#55dc8e}
.bad{color:#ff7777}
.copy{width:100%;margin-top:12px;background:#263d30}
.secondary{width:100%;margin-top:10px}
#results{margin-top:20px}
.item{
 padding:12px;margin-top:9px;
 background:#22252b;border-radius:8px;
 display:flex;align-items:center;
 justify-content:space-between;gap:10px
}
.item code{overflow-wrap:anywhere}
.item button{padding:8px 12px}
.note{font-size:12px;color:#888;line-height:1.6;margin-top:18px}
</style>
</head>
<body>
<main>
 <h2>Roblox Username Generator</h2>
 <div class="sub">I / l / 1 Username Search Tool</div>

 <div class="section">
  <div class="length">
   <b>Username Length</b>
   <b id="lengthValue">12</b>
  </div>
  <input id="length" type="range" min="6" max="20" value="12">
 </div>

 <div class="section">
  <b>Character Settings</b>
  <div class="options">
   <label class="option">
    <input type="checkbox" id="upper" checked> I
   </label>
   <label class="option">
    <input type="checkbox" id="lower" checked> l
   </label>
   <label class="option">
    <input type="checkbox" id="one" checked> 1
   </label>
  </div>
 </div>

 <div class="section">
  <b>Search Count</b>
  <div style="margin-top:10px">
   <input id="count" type="number" min="1" max="50" value="5">
   <span class="sub">候補数（1〜50）</span>
  </div>
 </div>

 <button class="primary" id="generate">Generate & Check</button>

 <div class="result">
  <div class="sub">LATEST GENERATED USERNAME</div>
  <div class="username" id="username">Waiting...</div>
  <div class="status" id="status">Ready</div>
  <button class="copy" id="copy" disabled>Copy Username</button>
 </div>

 <div id="results"></div>

 <div class="note">
  Roblox公式ユーザー検索APIを使用します。検索結果に完全一致するユーザーがいない場合は「未検出候補」として表示します。取得可能であることを保証するものではありません。
 </div>
</main>

<script>
const $ = id => document.getElementById(id);

const length = $('length');
const generate = $('generate');
const copy = $('copy');
const username = $('username');
const status = $('status');
const results = $('results');

length.oninput = () => {
 $('lengthValue').textContent = length.value;
};

function randomName(size, chars) {
 const limit = Math.floor(4294967296 / chars.length) * chars.length;
 let result = '';
 const values = new Uint32Array(64);

 while(result.length < size) {
  crypto.getRandomValues(values);
  for(const n of values) {
   if(n >= limit) continue;
   result += chars[n % chars.length];
   if(result.length >= size) break;
  }
 }
 return result;
}

async function checkUsername(name) {
 const url = new URL(
  'https://users.roblox.com/v1/users/search'
 );
 url.searchParams.set('keyword', name);
 url.searchParams.set('limit', '10');

 const response = await fetch(url);

 if(!response.ok) {
  throw new Error('HTTP ' + response.status);
 }

 const data = await response.json();

 if(!Array.isArray(data.data)) {
  throw new Error('Invalid API response');
 }

 return data.data.some(user =>
  typeof user.name === 'string' &&
  user.name.toLowerCase() === name.toLowerCase()
 );
}

function addResult(name, found) {
 const item = document.createElement('div');
 item.className = 'item';

 const label = document.createElement('code');
 label.textContent = name;

 const button = document.createElement('button');

 if(found) {
  button.textContent = '使用済み';
  button.disabled = true;
 } else {
  button.textContent = 'Copy';
  button.onclick = async () => {
   try {
    await navigator.clipboard.writeText(name);
    button.textContent = 'Copied!';
   } catch {
    button.textContent = 'Copy failed';
   }
  };
 }

 item.append(label, button);
 results.appendChild(item);
}

generate.onclick = async () => {
 let chars = '';
 if($('upper').checked) chars += 'I';
 if($('lower').checked) chars += 'l';
 if($('one').checked) chars += '1';

 if(!chars) {
  status.textContent = '文字を1つ以上選択してください';
  status.className = 'status bad';
  return;
 }

 const count = Math.max(1, Math.min(50,
  Number($('count').value) || 1
 ));

 generate.disabled = true;
 copy.disabled = true;
 results.replaceChildren();

 let checked = 0;
 let errors = 0;
 let latestAvailable = null;

 status.textContent = 'Checking...';
 status.className = 'status';

 for(let i = 0; i < count; i++) {
  const name = randomName(Number(length.value), chars);
  username.textContent = name;
  status.textContent = `Checking ${i+1}/${count}...`;

  try {
   const found = await checkUsername(name);
   checked++;

   addResult(name, found);

   if(!found) {
    latestAvailable = name;
    copy.disabled = false;
   }
  } catch(error) {
   errors++;
   addResult(name, null);
  }

  if(latestAvailable) {
   copy.disabled = false;
  }
 }

 if(latestAvailable) {
  username.textContent = latestAvailable;
  status.textContent =
   `未検出候補あり | ${checked}件確認 / ${errors}件エラー`;
  status.className = 'status good';
 } else if(checked > 0) {
  status.textContent =
   `完全一致なしの候補なし | ${checked}件確認 / ${errors}件エラー`;
  status.className = 'status';
 } else {
  status.textContent = 'API ERROR - 検索できませんでした';
  status.className = 'status bad';
 }

 generate.disabled = false;
};

copy.onclick = async () => {
 try {
  await navigator.clipboard.writeText(username.textContent);
  status.textContent = 'Copied!';
 } catch {
  status.textContent = 'Clipboard unavailable';
 }
};
</script>
</body>
</html>
